<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="action" >
         
        <div>
            <label for="fname"> username:</label>
            <input type="text" id="fname"  placeholder="Enter  name" name="s1"  />
        </div>
        <br>
        <div>
            <label for="t1">password:</label>
            <input type="password" id="t1"  placeholder="Enter password"  />
        </div>
        <br>
        <div>
           <input type="checkbox" id="c1" name="age" value="I am 18+"checked> 
            <label for="c1">I am 18+</label>
        </div>
        <br>
        <div>
            <input type="radio" id="r" name="fruit" value="apple" > 
            <label for="r">Apple</label>
            <input type="radio" id="r1" name="fruit" value="mango" > 
            <label for="r1">mango</label>
        </div>
        <br>
        <div>
            <label for="cars">Choose a car:</label>
            <select name="cars" id="cars">
                <option value="volvo">Volvo </option>
                <option value="saab">Saab</option>
                <option value="mercedes">Mercedes</option>
                <option value="audi">Audi</option>
            </select>
            
        </div>
        <br>
        <div>
            <button type="submit">Submit</button>
        </div>
        <br>
        <div>
           Select your Volume <input type="range" id="vol" min="0" max="100" name="S" step="10">
        </div>
        <div>
           please give your feedback: <textarea id="a" name="a" rows="4" cols="50"></textarea>
        </div>
       

        

    </form>
    <hr>
    <form action="https://www.youtube.com/results?">
        <input type="text" placeholder="Search for a song" name="search_query" />
        <button>Search</button>
    </form>
     <hr>
    <form action="https://www.google.com/search?">
        <input type="text" placeholder="Search on Google" name="q" />
        <button>Search</button>
    </form>
    
    
</html>
